<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionSelector Pro — 亚马逊美国站跨境服装选品情报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FAFAFA;--card:#FFFFFF;--accent:#2D5A27;--accent-light:#E8F0E7;
  --alert:#C8553D;--alert-light:#FDF0ED;--text-primary:#1A1A1A;
  --text-secondary:#6B7280;--border:#E5E7EB;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-hover:0 10px 25px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.04);
  --radius:12px;--radius-sm:8px;
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Playfair Display','DM Sans',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',serif}

.container{max-width:1200px;margin:0 auto;padding:0 24px}

.fade-in{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.fade-in.visible{opacity:1;transform:translateY(0)}

header{
  background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(12px);background:rgba(255,255,255,.92);
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{
  font-size:1.65rem;font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:1.2;
}
.brand .subtitle{
  font-family:'DM Sans',-apple-system,sans-serif;font-size:.82rem;color:var(--text-secondary);font-weight:400;letter-spacing:.02em;
}
.header-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.update-time{font-size:.78rem;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.update-time svg{width:14px;height:14px;stroke:var(--text-secondary)}
.refresh-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--card);color:var(--text-primary);font-size:.82rem;
  font-weight:500;cursor:pointer;transition:all .2s ease;font-family:inherit;
}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow)}
.refresh-btn svg{width:14px;height:14px;stroke:currentColor;transition:transform .4s ease}
.refresh-btn:hover svg{transform:rotate(180deg)}
.refresh-btn.loading svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:40px 0 80px}

.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:56px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;
  text-align:center;transition:all .3s ease;position:relative;overflow:hidden;
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0;transition:opacity .3s ease;
}
.stat-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.stat-card:hover::before{opacity:1}
.stat-value{
  font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;color:var(--accent);line-height:1.1;
}
.stat-label{font-size:.82rem;color:var(--text-secondary);margin-top:6px;font-weight:500;letter-spacing:.03em}

.section{margin-bottom:56px}
.section-header{margin-bottom:24px;display:flex;align-items:baseline;gap:12px}
.section-header h2{
  font-size:1.5rem;font-weight:600;color:var(--text-primary);letter-spacing:-.01em;
}
.section-header .section-line{flex:1;height:1px;background:var(--border)}
.section-header .section-count{
  font-family:'DM Sans',sans-serif;font-size:.78rem;color:var(--text-secondary);font-weight:500;
  background:var(--accent-light);padding:3px 10px;border-radius:20px;
}

.news-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.news-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  transition:all .3s ease;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;
}
.news-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);border-color:var(--accent)}
.news-card .news-source{
  font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;
}
.news-card .news-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;line-height:1.4;color:var(--text-primary)}
.news-card .news-summary{font-size:.85rem;color:var(--text-secondary);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.news-card .news-meta{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.news-card .news-date{font-size:.75rem;color:var(--text-secondary)}
.news-card .news-tags{display:flex;gap:6px;flex-wrap:wrap}
.news-link{
  display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--accent);text-decoration:none;font-weight:600;
  padding:8px 16px;border:1px solid var(--accent);border-radius:var(--radius-sm);transition:all .2s ease;margin-top:4px;
}
.news-link:hover{background:var(--accent);color:#fff}
.news-link svg{width:13px;height:13px;stroke:currentColor}
.tag{
  font-size:.7rem;padding:3px 10px;border-radius:20px;font-weight:500;letter-spacing:.01em;
  background:var(--accent-light);color:var(--accent);
}
.tag-alert{background:var(--alert-light);color:var(--alert)}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.product-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  transition:all .3s ease;display:flex;flex-direction:column;gap:12px;
}
.product-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.product-card .product-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.product-card .product-title{
  font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;line-height:1.4;flex:1;
}
.product-card .product-price{
  font-size:1.3rem;font-weight:700;color:var(--accent);white-space:nowrap;
}
.product-card .product-price span{font-size:.75rem;font-weight:400;color:var(--text-secondary)}
.product-features{display:flex;gap:6px;flex-wrap:wrap}
.product-scores{display:flex;gap:16px;flex-wrap:wrap}
.score-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 14px;
  background:var(--bg);border-radius:var(--radius-sm);min-width:70px;
}
.score-item .score-value{font-size:1.1rem;font-weight:700;color:var(--accent)}
.score-item .score-value.alert{color:var(--alert)}
.score-item .score-label{font-size:.68rem;color:var(--text-secondary);font-weight:500}
.product-expand-btn{
  background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 16px;
  font-size:.78rem;color:var(--text-secondary);cursor:pointer;transition:all .2s ease;font-family:inherit;align-self:flex-start;
}
.product-expand-btn:hover{border-color:var(--accent);color:var(--accent)}
.product-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.product-details{
  display:none;
}
.product-details.open{display:block}
.product-details-inner{
  padding-top:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;
}
.detail-group h4{font-size:.78rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.detail-group ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.detail-group ul li{font-size:.84rem;color:var(--text-primary);padding-left:14px;position:relative}
.detail-group ul li::before{content:'';position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.product-link{
  display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:500;
  transition:opacity .2s;
}
.product-link:hover{opacity:.7}
.product-link svg{width:12px;height:12px;stroke:currentColor}
.source-link{color:var(--text-secondary)!important;margin-left:8px}

.elements-grid{display:flex;flex-wrap:wrap;gap:12px}
.element-pill{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 20px;transition:all .3s ease;min-width:200px;flex:1;
}
.element-pill:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.element-pill.core{border-left:3px solid var(--accent)}
.element-pill .element-name{font-weight:600;font-size:.92rem;min-width:100px}
.element-pill .element-bar-wrap{flex:1;display:flex;flex-direction:column;gap:3px}
.element-pill .element-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.element-pill .element-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .8s ease}
.element-pill .element-meta{display:flex;gap:12px;font-size:.72rem;color:var(--text-secondary)}
.element-pill .element-freq{font-weight:600;color:var(--accent)}

.suggestions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.suggestion-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  transition:all .3s ease;border-left:3px solid var(--accent);
}
.suggestion-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.suggestion-card .suggestion-element{
  font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:var(--accent);margin-bottom:4px;
}
.suggestion-card .suggestion-type{
  font-size:.7rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;
}
.suggestion-card .suggestion-desc{font-size:.88rem;color:var(--text-primary);line-height:1.65}

.pitfalls-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pitfall-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  transition:all .3s ease;border-left:3px solid var(--alert);
}
.pitfall-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.pitfall-card .pitfall-title{
  font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;color:var(--alert);margin-bottom:8px;
}
.pitfall-card .pitfall-desc{font-size:.88rem;color:var(--text-primary);line-height:1.65;margin-bottom:12px}
.pitfall-card .pain-points{display:flex;flex-direction:column;gap:4px}
.pitfall-card .pain-point{
  font-size:.8rem;color:var(--text-secondary);padding:5px 10px;background:var(--alert-light);border-radius:6px;
}

.potential-section .potential-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.potential-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;
  transition:all .3s ease;border-left:3px solid #D4A843;display:flex;flex-direction:column;gap:10px;
}
.potential-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.potential-card .potential-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;line-height:1.4}
.potential-card .potential-price{font-size:1.2rem;font-weight:700;color:#D4A843}

footer{
  background:var(--card);border-top:1px solid var(--border);padding:32px 24px;text-align:center;
}
footer .footer-text{font-size:.78rem;color:var(--text-secondary);line-height:1.8}
footer .footer-text strong{color:var(--text-primary);font-weight:600}

.loading-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;
}
.loading-spinner{
  width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
.loading-text{font-size:.88rem;color:var(--text-secondary)}

.error-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:12px;
}
.error-state .error-icon{font-size:2.5rem;color:var(--alert)}
.error-state .error-msg{font-size:.92rem;color:var(--text-secondary);text-align:center;max-width:400px}
.error-state .retry-btn{
  padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  font-size:.85rem;cursor:pointer;font-family:inherit;font-weight:500;transition:opacity .2s;
}
.error-state .retry-btn:hover{opacity:.85}

.empty-state{padding:40px;text-align:center;color:var(--text-secondary);font-size:.9rem}

@media(max-width:768px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .news-grid,.products-grid,.suggestions-grid,.pitfalls-grid,.potential-section .potential-grid{grid-template-columns:1fr}
  .header-inner{flex-direction:column;align-items:flex-start}
  .element-pill{min-width:100%}
}
@media(max-width:480px){
  .stats-bar{grid-template-columns:1fr}
  .container{padding:0 16px}
  main{padding:24px 0 60px}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>FashionSelector Pro</h1>
      <span class="subtitle">亚马逊美国站跨境服装选品情报</span>
    </div>
    <div class="header-meta">
      <div class="update-time" id="updateTime">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>加载中...</span>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新数据
      </button>
    </div>
  </div>
</header>

<main class="container" id="mainContent">
  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在获取选品情报...</div>
  </div>
</main>

<footer id="footer" style="display:none">
  <div class="footer-text">
    <strong>FashionSelector Pro</strong> — 数据驱动选品决策<br>
    数据来源：亚马逊商品数据 · 行业资讯聚合 · 趋势分析引擎<br>
    本工具仅供参考，不构成投资建议
  </div>
</footer>

<script>
const API_URL = '/api/skill-result';
let currentData = null;

function formatTime(isoStr) {
  if (!isoStr) return '未知';
  try {
    const d = new Date(isoStr);
    return d.toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch { return isoStr; }
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    return d.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit' });
  } catch { return dateStr; }
}

function renderHeader(data) {
  const el = document.getElementById('updateTime');
  el.querySelector('span').textContent = '更新于 ' + formatTime(data.run_time);
}

function renderStats(data) {
  const stats = data.data_statistics || {};
  const elements = (data.top10_elements && data.top10_elements.elements) || [];
  const coreCount = elements.filter(e => e.is_core).length;
  const pitfalls = (data.pitfall_warnings && data.pitfall_warnings.pitfalls) || [];
  const items = [
    { value: stats.hit_products || 0, label: '爆品推荐' },
    { value: coreCount, label: '核心元素' },
    { value: stats.news_count || 0, label: '新闻资讯' },
    { value: pitfalls.length, label: '避坑预警' }
  ];
  return `
    <div class="stats-bar fade-in">
      ${items.map(i => `
        <div class="stat-card">
          <div class="stat-value">${i.value}</div>
          <div class="stat-label">${i.label}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderNews(data) {
  const items = data.news_items || [];
  if (!items.length) return '';
  return `
    <section class="section fade-in">
      <div class="section-header">
        <h2>行业资讯</h2>
        <div class="section-line"></div>
        <span class="section-count">${items.length} 条</span>
      </div>
      <div class="news-grid">
        ${items.map(n => `
          <div class="news-card">
            <div class="news-source">${n.source || '综合资讯'}</div>
            <div class="news-title">${n.title}</div>
            <div class="news-summary">${n.summary || ''}</div>
            <div class="news-meta">
              <span class="news-date">${formatDate(n.date)}</span>
              <div class="news-tags">
                ${(n.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
              </div>
            </div>
            ${n.url ? `
              <a class="news-link" href="${n.url}" target="_blank" rel="noopener">
                阅读原文
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </a>
            ` : ''}
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderProducts(products, sectionTitle, sectionId, cardStyle) {
  if (!products || !products.length) return '';
  return `
    <section class="section fade-in" id="${sectionId}">
      <div class="section-header">
        <h2>${sectionTitle}</h2>
        <div class="section-line"></div>
        <span class="section-count">${products.length} 件</span>
      </div>
      <div class="products-grid">
        ${products.map((p, idx) => {
          const marginPct = p.expected_margin != null ? Math.round(p.expected_margin * 100) : null;
          const uniqPct = p.uniqueness_coefficient != null ? Math.round(p.uniqueness_coefficient * 100) : null;
          const marginAlert = p.margin_alert;
          return `
            <div class="product-card ${cardStyle || ''}">
              <div class="product-header">
                <div class="product-title">${p.title}</div>
                ${p.price != null ? `<div class="product-price">$${p.price.toFixed(2)}<span> USD</span></div>` : ''}
              </div>
              <div class="product-features">
                ${(p.features || []).map(f => `<span class="tag">${f}</span>`).join('')}
              </div>
              <div class="product-scores">
                ${marginPct != null ? `
                  <div class="score-item">
                    <div class="score-value ${marginAlert ? 'alert' : ''}">${marginPct}%</div>
                    <div class="score-label">预期利润</div>
                  </div>
                ` : ''}
                ${uniqPct != null ? `
                  <div class="score-item">
                    <div class="score-value">${uniqPct}%</div>
                    <div class="score-label">独特性</div>
                  </div>
                ` : ''}
                ${p.review_status ? `
                  <div class="score-item">
                    <div class="score-value" style="font-size:.82rem">${p.review_status}</div>
                    <div class="score-label">评论状态</div>
                  </div>
                ` : ''}
              </div>
              <div class="product-links">
                ${p.url ? `
                  <a class="product-link" href="${p.url}" target="_blank" rel="noopener">
                    在亚马逊查看
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                  </a>
                ` : ''}
                ${p.source_url ? `
                  <a class="product-link source-link" href="${p.source_url}" target="_blank" rel="noopener">
                    查看原文
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                  </a>
                ` : ''}
              </div>
              <button class="product-expand-btn" onclick="toggleDetails('${sectionId}', ${idx}, this)">查看详情</button>
              <div class="product-details" id="details-${sectionId}-${idx}">
                <div class="product-details-inner">
                  ${(p.selling_points && p.selling_points.length) ? `
                    <div class="detail-group">
                      <h4>核心卖点</h4>
                      <ul>${p.selling_points.map(s => `<li>${s}</li>`).join('')}</ul>
                    </div>
                  ` : ''}
                  ${(p.trend_match_points && p.trend_match_points.length) ? `
                    <div class="detail-group">
                      <h4>趋势匹配</h4>
                      <ul>${p.trend_match_points.map(t => `<li>${t}</li>`).join('')}</ul>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;
}

function toggleDetails(sectionId, idx, btn) {
  const details = document.getElementById('details-' + sectionId + '-' + idx);
  if (!details) return;
  const isOpen = details.classList.contains('open');
  details.classList.toggle('open');
  btn.textContent = isOpen ? '查看详情' : '收起详情';
}

function renderElements(data) {
  const elements = (data.top10_elements && data.top10_elements.elements) || [];
  if (!elements.length) return '';
  const maxFreq = Math.max(...elements.map(e => e.frequency), 1);
  return `
    <section class="section fade-in">
      <div class="section-header">
        <h2>核心趋势元素</h2>
        <div class="section-line"></div>
        <span class="section-count">Top ${elements.length}</span>
      </div>
      <div class="elements-grid">
        ${elements.map(e => `
          <div class="element-pill ${e.is_core ? 'core' : ''}">
            <div class="element-name">${e.element}</div>
            <div class="element-bar-wrap">
              <div class="element-bar">
                <div class="element-bar-fill" style="width:${Math.round((e.frequency / maxFreq) * 100)}%"></div>
              </div>
              <div class="element-meta">
                <span class="element-freq">频次 ${e.frequency}</span>
                ${e.margin != null ? `<span>利润 ${Math.round(e.margin * 100)}%</span>` : ''}
                ${e.is_core ? '<span style="color:var(--accent);font-weight:600">核心</span>' : ''}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderSuggestions(data) {
  const suggestions = (data.visual_diff_suggestions && data.visual_diff_suggestions.suggestions) || [];
  if (!suggestions.length) return '';
  return `
    <section class="section fade-in">
      <div class="section-header">
        <h2>视觉差异化建议</h2>
        <div class="section-line"></div>
        <span class="section-count">${suggestions.length} 条</span>
      </div>
      <div class="suggestions-grid">
        ${suggestions.map(s => `
          <div class="suggestion-card">
            <div class="suggestion-element">${s.element}</div>
            <div class="suggestion-type">${s.suggestion_type || '差异化建议'}</div>
            <div class="suggestion-desc">${s.description}</div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderPitfalls(data) {
  const pitfalls = (data.pitfall_warnings && data.pitfall_warnings.pitfalls) || [];
  if (!pitfalls.length) return '';
  return `
    <section class="section fade-in">
      <div class="section-header">
        <h2>避坑预警</h2>
        <div class="section-line"></div>
        <span class="section-count">${pitfalls.length} 条</span>
      </div>
      <div class="pitfalls-grid">
        ${pitfalls.map(p => `
          <div class="pitfall-card">
            <div class="pitfall-title">${p.title}</div>
            <div class="pitfall-desc">${p.description}</div>
            ${(p.pain_points && p.pain_points.length) ? `
              <div class="pain-points">
                ${p.pain_points.map(pp => `<div class="pain-point">${pp}</div>`).join('')}
              </div>
            ` : ''}
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderPotential(data) {
  const products = (data.potential_products && data.potential_products.products) || [];
  if (!products.length) return '';
  return `
    <section class="section potential-section fade-in">
      <div class="section-header">
        <h2>潜力商品</h2>
        <div class="section-line"></div>
        <span class="section-count">${products.length} 件</span>
      </div>
      <div class="potential-grid">
        ${products.map(p => `
          <div class="potential-card">
            <div class="potential-title">${p.title}</div>
            ${p.price != null ? `<div class="potential-price">$${p.price.toFixed(2)}</div>` : ''}
            <div class="product-features">
              ${(p.features || []).map(f => `<span class="tag">${f}</span>`).join('')}
            </div>
            <div class="product-scores">
              ${p.expected_margin != null ? `
                <div class="score-item">
                  <div class="score-value">${Math.round(p.expected_margin * 100)}%</div>
                  <div class="score-label">预期利润</div>
                </div>
              ` : ''}
              ${p.uniqueness_coefficient != null ? `
                <div class="score-item">
                  <div class="score-value">${Math.round(p.uniqueness_coefficient * 100)}%</div>
                  <div class="score-label">独特性</div>
                </div>
              ` : ''}
            </div>
            <div class="product-links">
              ${p.url ? `
                <a class="product-link" href="${p.url}" target="_blank" rel="noopener">
                  在亚马逊查看
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </a>
              ` : ''}
              ${p.source_url ? `
                <a class="product-link source-link" href="${p.source_url}" target="_blank" rel="noopener">
                  查看原文
                  <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </a>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderUniqueness(data) {
  const recs = (data.uniqueness_recommendations && data.uniqueness_recommendations.recommendations) || [];
  if (!recs.length) return '';
  return `
    <section class="section fade-in">
      <div class="section-header">
        <h2>差异化推荐</h2>
        <div class="section-line"></div>
        <span class="section-count">${recs.length} 条</span>
      </div>
      <div class="suggestions-grid">
        ${recs.map(r => `
          <div class="suggestion-card">
            ${r.element ? `<div class="suggestion-element">${r.element}</div>` : ''}
            ${r.recommendation_type ? `<div class="suggestion-type">${r.recommendation_type}</div>` : ''}
            <div class="suggestion-desc">${r.description || r.recommendation || ''}</div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderPage(data) {
  currentData = data;
  renderHeader(data);

  const main = document.getElementById('mainContent');
  main.innerHTML = [
    renderStats(data),
    renderNews(data),
    renderProducts(
      (data.hit_products && data.hit_products.products) || [],
      '爆品推荐', 'hitProducts'
    ),
    renderPotential(data),
    renderElements(data),
    renderSuggestions(data),
    renderUniqueness(data),
    renderPitfalls(data)
  ].join('');

  document.getElementById('footer').style.display = '';

  requestAnimationFrame(() => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  });
}

function renderError(msg) {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="error-state">
      <div class="error-icon">⚠</div>
      <div class="error-msg">${msg || '数据加载失败，请稍后重试'}</div>
      <button class="retry-btn" onclick="fetchData()">重新加载</button>
    </div>
  `;
}

async function fetchData() {
  const btn = document.getElementById('refreshBtn');
  const main = document.getElementById('mainContent');

  btn.classList.add('loading');

  if (!currentData) {
    main.innerHTML = `
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在获取选品情报...</div>
      </div>
    `;
  }

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderPage(data);
  } catch (err) {
    console.error('Fetch error:', err);
    if (!currentData) {
      renderError('无法连接数据服务，请检查网络后重试');
    }
  } finally {
    btn.classList.remove('loading');
  }
}

document.addEventListener('DOMContentLoaded', fetchData);
</script>
</body>
</html>
